name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: npm ci

      # Falha se um import não resolver, se algo importado não for usado, ou se
      # um bundle.js estiver mais velho que um módulo que ele contém (o modo
      # file:// rodaria código antigo).
      - name: Checagem estática
        run: npm run check

      # Os dados gerados têm de bater com o Dart original: se o gerador produzir
      # algo diferente do que está commitado, alguém editou à mão.
      - name: Dados gerados estão em sincronia
        run: |
          npm run gen
          git diff --exit-code -- web/js/questions.js web/js/translations.js web/js/offensive_words.js

      # Mesma checagem para o bundle: regerar não pode mudar nada.
      - name: Bundle está em sincronia
        run: |
          npm run bundle
          git diff --exit-code -- web/js/bundle.js

      # A suíte inteira, nos dois transportes, subindo o servidor por conta.
      #
      # Por que um comando só e não um passo por teste: enumerar os testes aqui
      # significava manter a lista em dois lugares, e a CI já tinha ficado atrás
      # da suíte local — rodava dois testes por file:// enquanto o
      # `npm run verify` roda os nove. `file://` não é detalhe de ambiente: o
      # totem abre o jogo do disco, e um bug de caminho relativo do admin
      # atravessou justamente essa fresta.
      - name: Suíte completa (HTTP e file://)
        run: npm run verify

      - name: Guardar capturas quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: |
            shots/
            play/
            play2/
          if-no-files-found: ignore
          retention-days: 7
