<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
<title>probe</title>
</head>
<body>
<div id="viewport"><div id="stage"><div id="pages"></div><div id="overlays"></div></div></div>
<script type="module">
import { showDialog } from './js/dialog.js';
import { PopUpWidget } from './js/components/pop_up.js';
window.__probe = async (texto, tipo) => {
  document.getElementById('overlays').innerHTML = '';
  showDialog({ builder: () => PopUpWidget({ texto, tipo }) });
  await new Promise(r => setTimeout(r, 1500));
  const frame = document.querySelector('#overlays .ff-dialog > * ');
  const container = document.querySelector('#overlays .ff-container');
  const row = document.querySelector('#overlays .ff-row');
  const txt = document.querySelector('#overlays .ff-text');
  const rect = (n) => { if(!n) return null; const r = n.getBoundingClientRect(); return {x:+r.x.toFixed(1),y:+r.y.toFixed(1),w:+r.width.toFixed(1),h:+r.height.toFixed(1)}; };
  const cont = rect(container), t = rect(txt), r2 = rect(row);
  return {
    container: cont, row: r2, text: t,
    rowH: r2 && r2.h,
    textTopInFrame: t && cont && +(t.y - cont.y).toFixed(1),
    textBottomInFrame: t && cont && +(t.y + t.h - cont.y).toFixed(1),
    frameH: cont && cont.h,
    slack: t && cont && +((cont.y + cont.h) - (t.y + t.h)).toFixed(1),
    lines: txt ? Math.round(t.h / parseFloat(getComputedStyle(txt).lineHeight)) : null,
    lineHeight: txt ? parseFloat(getComputedStyle(txt).lineHeight) : null,
    fontSize: txt ? getComputedStyle(txt).fontSize : null,
    scale: getComputedStyle(document.getElementById('stage')).transform,
  };
};
window.__ready = true;
</script>
</body>
</html>
