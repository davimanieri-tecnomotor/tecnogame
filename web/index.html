<!DOCTYPE html>
<!--
  data-theme pins FlutterFlowTheme's dark palette, which is what the kiosk
  showed: every Text in the Dart that doesn't override its colour falls back to
  theme.primaryText, and the whole game is drawn on dark/blue art. The Flutter
  app used ThemeMode.system, so removing this attribute restores that exact
  behaviour (both palettes are in css/app.css and follow prefers-color-scheme);
  in light mode the uncoloured labels turn near-black, as they did there.
-->
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TecGame">

  <meta name="robots" content="noindex" />

  <link rel="icon" type="image/png" href="favicon.png" />

  <meta property="og:title" content="TecGame" />
  <meta property="og:description" content="Jogo de quiz da Tecnomotor: gire a roleta, escolha o scanner e aponte o defeito em 60 segundos." />
  <meta name="twitter:title" content="TecGame" />
  <meta name="twitter:description" content="Jogo de quiz da Tecnomotor: gire a roleta, escolha o scanner e aponte o defeito em 60 segundos." />
  <meta name="twitter:card" content="summary_large_image" />

  <title> TecGame </title>
  <meta name="description" content="Jogo de quiz da Tecnomotor: gire a roleta, escolha o scanner e aponte o defeito em 60 segundos." />

  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f4f8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1d2428">

  <!-- Fontes auto-hospedadas (scripts/fetch_fonts.py). Antes vinham do CDN do
       Google, e o totem de feira sem internet caia para a fonte do sistema. -->
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/app.css">
  <!-- A administração mora neste mesmo documento (um endereço só, para o
       GitHub Pages). O CSS dela vive inteiro sob `.adm`, então não alcança o
       palco do jogo; ver o cabeçalho de css/admin.css. -->
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <!-- The whole app is laid out on a fixed 1920x1080 stage (the resolution the
       FlutterFlow app was designed for) and uniformly scaled to fit the window,
       so every hard-coded size from the Dart source lands on the same pixel. -->
  <div id="viewport">
    <div id="stage">
      <!-- O chão. Todas as dez telas desenham o mesmo BG_Seleo_Equipamento por
           conta própria, e entre uma e outra o #pages fica vazio por um
           instante: com transição de verdade (e não corte seco), esse instante
           aparece como um piscar. Esta camada fica parada por baixo, com a
           mesma arte no mesmo enquadramento, então o que atravessa é só o
           conteúdo. -->
      <div id="fundo" aria-hidden="true"></div>
      <div id="pages"></div>
      <div id="overlays"></div>
    </div>
    <!-- O jogo e 16:9 de tela cheia; em retrato a escala fica ilegivel. -->
    <div id="rotate-hint" aria-hidden="true">
      <div class="rotate-hint-inner">
        <svg viewBox="0 0 24 24" width="72" height="72" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="7" width="18" height="10" rx="2" />
          <path d="M8 3.5 A9 9 0 0 1 16 3.5" stroke-linecap="round" />
        </svg>
        <strong>Gire o aparelho</strong>
        <span>O TecGame foi feito para tela na horizontal.</span>
      </div>
    </div>
    <noscript>
      <div class="boot-message">
        <strong>Este jogo precisa de JavaScript.</strong>
        Habilite o JavaScript no navegador e recarregue a página.
      </div>
    </noscript>
  </div>

  <!-- A camada da administração. Fica vazia e escondida até alguém passar pela
       porta (cinco toques no selo do cadastro, ou #/adm, mais a senha); é
       js/admin/porta.js que a levanta. Vive FORA do #viewport de propósito: o
       jogo é um palco de 1920x1080 escalado, e o admin é HTML responsivo
       comum, que precisa da janela inteira e da rolagem. -->
  <div id="adm" class="adm" hidden></div>

  <script>
    // Boot with the readable ES modules in js/. Opening this file straight from
    // disk makes the browser refuse them ("blocked by CORS policy", because
    // file:// has a null origin), so fall back to js/bundle.js - the same code
    // concatenated into one classic script, which file:// does allow.
    // main.js guards on window.__tecgameBooted, so only the first one runs.
    (function () {
      var fellBack = false;

      function loadBundle() {
        if (window.__tecgameBooted || fellBack) return;
        fellBack = true;
        var s = document.createElement('script');
        s.src = 'js/bundle.js';
        s.onerror = showFailure;
        document.head.appendChild(s);
      }

      function showFailure() {
        if (window.__tecgameBooted) return;
        var el = document.createElement('div');
        el.className = 'boot-message';
        el.innerHTML =
          '<div><strong>O jogo não carregou.</strong>' +
          'Sirva a pasta <code>web/</code> por HTTP com <code>npm start</code><br>' +
          'e abra <code>http://localhost:8099</code>.</div>';
        document.body.appendChild(el);
      }

      window.__tecgameLoadBundle = loadBundle;
      // Safety net: if nothing booted, try the bundle, then report clearly.
      setTimeout(loadBundle, 2500);
      setTimeout(showFailure, 8000);
    })();
  </script>
  <script type="module" src="js/main.js" onerror="window.__tecgameLoadBundle()"></script>
</body>
</html>
