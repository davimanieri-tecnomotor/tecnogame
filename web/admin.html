<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>TecGame — administração</title>
  <link rel="icon" type="image/png" href="favicon.png">

  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div id="app"></div>

  <noscript>
    <div class="sem-js">Esta página precisa de JavaScript.</div>
  </noscript>

  <script>
    // Igual ao index.html: os módulos ES são recusados por file:// (origem
    // null), então cai para o bundle clássico. admin/main.js tem guarda em
    // window.__tecgameAdminBooted, e só o primeiro que chegar roda.
    (function () {
      var caiu = false;

      function carregarBundle() {
        if (window.__tecgameAdminBooted || caiu) return;
        caiu = true;
        var s = document.createElement('script');
        s.src = 'js/admin/bundle.js';
        s.onerror = mostrarFalha;
        document.head.appendChild(s);
      }

      function mostrarFalha() {
        if (window.__tecgameAdminBooted) return;
        var el = document.createElement('div');
        el.className = 'sem-js';
        el.innerHTML =
          '<div><strong>A administração não carregou.</strong>' +
          'Sirva a pasta <code>web/</code> por HTTP com <code>npm start</code><br>' +
          'e abra <code>http://localhost:8099/admin.html</code>.</div>';
        document.body.appendChild(el);
      }

      window.__tecgameAdminCarregarBundle = carregarBundle;
      setTimeout(carregarBundle, 2500);
      setTimeout(mostrarFalha, 8000);
    })();
  </script>
  <script type="module" src="js/admin/main.js" onerror="window.__tecgameAdminCarregarBundle()"></script>
</body>
</html>
