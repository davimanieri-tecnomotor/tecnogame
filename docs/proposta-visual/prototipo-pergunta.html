<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TecnoGame · protótipo da pergunta</title>
<!--
  PROTÓTIPO DE PROPOSTA. Não é o jogo e não entra no bundle.

  Mostra, jogável, a tela da pergunta do TecnoGame com cara de programa de
  auditório: palco com luz, o "Posso perguntar?", o relógio que virou
  conta-giros, a faixa ERRAR / RECORDE / ACERTAR, o "Está certo disso?", o
  suspense e as três revelações (acerto, erro, tempo esgotado). A proposta
  completa está no README.md desta pasta.

  Dois estilos, na tecla E: "Palco" (terço inferior com losangos, a gramática
  do Milionário) e "Clássico SBT" (a coluna do Show do Milhão de 2000, com os
  tons amostrados do programa).

  Segue as regras do jogo de propósito, para mostrar que tudo cabe nele:
    - um arquivo só, sem framework, sem build, sem dependência;
    - abre com dois cliques (file://): nada de módulo ES, nada de fetch;
    - palco fixo de 1920x1080 escalado para a janela;
    - todo som é sintetizado na Web Audio (por file:// não dá para buscar
      arquivo de áudio) e marcado no relógio do áudio;
    - com `prefers-reduced-motion`, saem câmera, tremor, confete e varredura.

  Imagens e fontes vêm de ../../web/assets; nada foi copiado. O ranking do
  painel "ACERTAR AGORA" é de exemplo.
-->
<style>
@property --feixe-cor { syntax: '<color>'; inherits: true; initial-value: rgb(150, 200, 255); }
@property --giro { syntax: '<angle>'; inherits: false; initial-value: 0deg; }

@font-face { font-family: 'pirulen'; src: url('../../web/assets/fonts/pirulen_rg.ttf') format('truetype'); font-display: block; }
@font-face { font-family: 'Paralucent'; src: url('../../web/assets/fonts/ParalucentMedium.otf') format('opentype'); font-weight: 500; font-display: block; }
@font-face { font-family: 'Paralucent'; src: url('../../web/assets/fonts/ParalucentBold.otf') format('opentype'); font-weight: 700; font-display: block; }
@font-face { font-family: 'Open Sans'; src: url('../../web/assets/fonts/google/open-sans-latin.woff2') format('woff2'); font-weight: 300 800; font-display: block; }
@font-face { font-family: 'Roboto'; src: url('../../web/assets/fonts/google/roboto-latin.woff2') format('woff2'); font-weight: 100 900; font-display: block; }

:root {
  --noite: #020B1F;
  --azul: #0051FF;
  --azul-claro: #3E8BFF;
  --ouro: #FFD84D;
  --ouro-forte: #FFB400;
  --verde: #1FD37A;
  --vermelho: #FF3B30;
  --prata: #CFD8E6;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: #000611;
  user-select: none; -webkit-user-select: none;
  touch-action: manipulation;
}

#viewport {
  position: fixed; inset: 0; overflow: hidden;
  background: radial-gradient(ellipse at center, #06173d 0%, #000611 70%);
}

/* `clip`, e não `hidden`: com `hidden` a caixa continua ROLÁVEL por programa
   (foco, scrollIntoView), e a lâmina e os refletores, que passam da borda de
   propósito, davam 200px de rolagem — o palco inteiro subia. */
#stage {
  position: absolute; left: 50%; top: 50%;
  width: 1920px; height: 1080px; overflow: clip;
  transform: translate(-50%, -50%) scale(var(--escala, 1));
  transform-origin: center;
  background: var(--noite);
  color: #fff; font-family: 'Open Sans', sans-serif;
  /* A cor da luz muda de humor devagar: é a mesa de luz, não um interruptor. */
  transition: --feixe-cor 700ms ease;
}

#camera, #tremor { position: absolute; inset: 0; }
#camera { transform-origin: 50% 50%; }

.oculta { opacity: 0; }

/* ------------------------------------------------------------------ palco */

.fundo {
  position: absolute; inset: 0;
  background: #020B1F url('../../web/assets/images/BG_Seleo_Equipamento.png') center / cover no-repeat;
  filter: brightness(var(--luz-fundo, .6)) saturate(1.15);
  transition: filter 700ms ease;
}

/* Os refletores. `screen` para ACENDER o que está embaixo, e não cobrir. O
   desfoque fica no pai e o recorte no filho: filtro vem antes de clip-path, e
   no mesmo elemento o cone sairia com a borda dura. */
.feixes {
  position: absolute; inset: 0; pointer-events: none;
  mix-blend-mode: screen;
  opacity: var(--feixes-op, .9);
  transition: opacity 600ms ease;
}
.feixe {
  position: absolute; top: -70px; width: 560px; height: 1320px; margin-left: -280px;
  transform-origin: 50% 0; filter: blur(20px);
}
.feixe-cone {
  position: absolute; inset: 0;
  clip-path: polygon(45% 0, 55% 0, 100% 100%, 0 100%);
  background: linear-gradient(to bottom,
    color-mix(in srgb, var(--feixe-cor) 62%, transparent) 0%,
    color-mix(in srgb, var(--feixe-cor) 20%, transparent) 42%,
    transparent 88%);
}
.feixe-fonte {
  position: absolute; left: 50%; top: 44px; width: 130px; height: 130px; margin-left: -65px;
  border-radius: 50%;
  background: radial-gradient(circle, #fff 0 12%, color-mix(in srgb, var(--feixe-cor) 80%, transparent) 30%, transparent 70%);
}

.nevoa {
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 60% 45% at 50% 20%, rgba(40, 110, 255, .20), transparent 70%),
    linear-gradient(to bottom, transparent 46%, rgba(1, 8, 26, .55) 60%, rgba(1, 6, 20, .92) 100%);
}

.cena { position: absolute; inset: 0; }

/* O canhão de luz do suspense: o resto do estúdio apaga e sobra a alternativa. */
.spot {
  position: absolute; inset: 0; pointer-events: none; opacity: 0;
  transition: opacity 600ms ease;
  background: radial-gradient(ellipse var(--spot-rx, 560px) var(--spot-ry, 250px) at var(--spot-x, 50%) var(--spot-y, 50%),
    rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0) 38%, rgba(0, 3, 12, .9) 100%);
}
.spot.ligado { opacity: 1; }

.vinheta {
  position: absolute; inset: 0; pointer-events: none; opacity: var(--tensao, 0);
  background: radial-gradient(ellipse at center, transparent 42%, rgba(60, 0, 0, .55) 78%, rgba(25, 0, 0, .92) 100%);
}
.pulso {
  position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(255, 0, 0, .38) 100%);
}
#particulas { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; }
.locutor { position: absolute; inset: 0; pointer-events: none; }
.locutor > * { pointer-events: auto; }
.locutor > .grito, .locutor > .raios { pointer-events: none; }
.flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: #fff; mix-blend-mode: screen; }

/* ------------------------------------------------------------------- selo */

.selo { position: absolute; pointer-events: none; }
.selo img { position: absolute; max-width: none; }
/* As lâmpadas do próprio selo, medidas no PNG, correndo como letreiro de
   auditório. Só acendem por cima: a arte já as desenha brancas. */
.lampada {
  position: absolute; width: var(--d); height: var(--d);
  margin: calc(var(--d) / -2) 0 0 calc(var(--d) / -2);
  border-radius: 50%;
  background: radial-gradient(circle, #fff 0 28%, rgba(255, 244, 190, .9) 42%, rgba(255, 200, 60, 0) 72%);
  mix-blend-mode: screen; opacity: .12;
  animation: lampada 1.44s ease-out infinite;
  animation-delay: calc(var(--i) * .12s);
}
@keyframes lampada {
  0% { opacity: 1; transform: scale(1.9); }
  28% { opacity: .12; transform: scale(1); }
  100% { opacity: .12; transform: scale(1); }
}
[data-humor="acerto"] .lampada { animation: lampada-festa .3s steps(2, jump-none) infinite; animation-delay: 0s; }
@keyframes lampada-festa { 0% { opacity: 1; transform: scale(1.8); } 100% { opacity: .1; transform: scale(1); } }
[data-humor="suspense"] .lampada, [data-humor="erro"] .lampada { animation: none; opacity: 0; }

/* -------------------------------------------------------- ordem de serviço */

.os { position: absolute; left: 64px; top: 58px; width: 560px; height: 480px; }
.os-chip {
  position: absolute; left: 0; top: 0; height: 66px; padding: 0 24px 0 10px;
  display: flex; align-items: center; gap: 12px; border-radius: 14px;
  background: linear-gradient(180deg, rgba(14, 48, 124, .88), rgba(4, 18, 52, .88));
  border: 1px solid rgba(160, 200, 255, .35);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .45);
}
.os-chip img { width: 44px; height: 58px; object-fit: contain; object-view-box: inset(4.6% 22.3% 4.6% 22.4%); }
.os-chip small { display: block; font: 700 12px/1.3 'Open Sans'; letter-spacing: 2.5px; color: #9fb7e8; }
.os-chip strong { display: block; font: 21px/1.2 'pirulen'; letter-spacing: 1px; color: #fff; font-weight: normal; }
.os-palco { position: absolute; left: 0; top: 78px; width: 560px; height: 318px; }
.os-luz {
  position: absolute; left: 50%; top: -150px; width: 470px; height: 480px; margin-left: -235px;
  background: linear-gradient(to bottom, rgba(170, 215, 255, .5), rgba(170, 215, 255, .08) 80%, transparent);
  clip-path: polygon(40% 0, 60% 0, 100% 100%, 0 100%);
  filter: blur(14px); mix-blend-mode: screen; pointer-events: none;
}
.os-piso {
  position: absolute; left: 50%; bottom: -14px; width: 520px; height: 84px; margin-left: -260px;
  border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(110, 175, 255, .6), rgba(20, 70, 200, .2) 46%, transparent 70%);
  box-shadow: inset 0 0 0 2px rgba(160, 205, 255, .35);
}
.os-carro {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: contain; object-view-box: inset(16.2% 9.5% 17.2% 5%);
  filter: drop-shadow(0 22px 18px rgba(0, 0, 0, .6));
}
/* Placa Mercosul, com o nome do veículo no lugar dos caracteres. */
.placa {
  position: absolute; left: 50%; top: 404px; width: 318px; height: 76px; margin-left: -159px;
  border-radius: 9px; overflow: hidden;
  background: linear-gradient(#ffffff, #e6ebf2);
  border: 3px solid #1b1b1b;
  box-shadow: 0 10px 24px rgba(0, 0, 0, .55), inset 0 0 0 2px #fff;
}
.placa-faixa {
  position: relative; height: 20px;
  background: linear-gradient(90deg, #0b3a9c, #1552cc);
  color: #fff; font: 700 12px/20px 'Roboto'; letter-spacing: 4px; text-align: center;
}
.placa-faixa::before { /* o selo do Mercosul, simplificado */
  content: ''; position: absolute; left: 7px; top: 3px; width: 14px; height: 14px; border-radius: 50%;
  background: radial-gradient(circle, #fff 0 18%, transparent 20%), #0b3a9c; box-shadow: inset 0 0 0 1.5px #fff;
}
.placa-bandeira { position: absolute; right: 7px; top: 3px; width: 20px; height: 14px; background: #009c3b; }
.placa-bandeira::before { content: ''; position: absolute; inset: 2px 2px; background: #ffdf00; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
.placa-bandeira::after { content: ''; position: absolute; left: 7px; top: 4px; width: 6px; height: 6px; border-radius: 50%; background: #002776; }
.placa-texto { font: 700 42px/54px 'Roboto'; color: #111; text-align: center; letter-spacing: 3px; }

/* ----------------------------------------------------------------- ajudas */

.ajudas { position: absolute; left: 628px; top: 250px; width: 664px; }
.ajudas-titulo {
  display: flex; justify-content: center; align-items: center; gap: 14px;
  font: 17px/1 'pirulen'; letter-spacing: 3px; color: #cfe0ff;
}
.ajudas-titulo b { font-weight: normal; color: var(--ouro); }
.ajudas-titulo .pinos { display: inline-flex; gap: 6px; }
.ajudas-titulo .pinos i { width: 13px; height: 13px; border-radius: 50%; background: var(--ouro); box-shadow: 0 0 10px rgba(255, 216, 77, .8); transition: background 300ms, box-shadow 300ms; }
.ajudas-titulo .pinos i.gasto { background: #2a3448; box-shadow: none; }
.ajudas-fichas { display: flex; justify-content: space-between; margin-top: 18px; }
.ficha { position: relative; width: 112px; cursor: pointer; perspective: 700px; }
.ficha-moeda {
  position: relative; width: 112px; height: 112px;
  transform-style: preserve-3d;
  transition: transform 700ms cubic-bezier(.3, 1.35, .5, 1);
}
.ficha:active .ficha-moeda { scale: .94; }
.ficha-face, .ficha-verso {
  position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
}
.ficha-face {
  background: radial-gradient(circle at 35% 28%, #3574ff, #0b3196 55%, #051a55 100%);
  box-shadow: inset 0 0 0 4px #ffd84d, inset 0 0 0 7px rgba(0, 0, 0, .35), 0 10px 22px rgba(0, 0, 0, .5), 0 0 26px rgba(80, 150, 255, .35);
}
.ficha-face::after { /* o brilho que ronda o aro */
  content: ''; position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from var(--giro), transparent 0 68%, rgba(255, 255, 255, .85) 77%, transparent 86%);
  -webkit-mask: radial-gradient(circle, transparent 49px, #000 50px, #000 56px, transparent 57px);
  mask: radial-gradient(circle, transparent 49px, #000 50px, #000 56px, transparent 57px);
  animation: ficha-giro 3.4s linear infinite;
  animation-delay: calc(var(--i) * -.68s);
}
@keyframes ficha-giro { to { --giro: 360deg; } }
.ficha-verso {
  transform: rotateY(180deg);
  background: radial-gradient(circle at 35% 28%, #5d6880, #2a3346 60%, #151b28);
  box-shadow: inset 0 0 0 4px #7d8699, 0 10px 22px rgba(0, 0, 0, .5);
}
.ficha svg { width: 56px; height: 56px; fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.ficha-verso svg { stroke: #ff5a4f; stroke-width: 7; width: 62px; height: 62px; }
.ficha-rotulo {
  width: 150px; margin: 10px 0 0 -19px; text-align: center; white-space: pre-line;
  font: 800 13px/1.15 'Open Sans'; letter-spacing: 1.2px; color: #dbe6ff;
}
.ficha.usada { cursor: default; }
.ficha.usada .ficha-moeda { transform: rotateY(180deg); }
.ficha.usada .ficha-rotulo { color: #6f7b93; text-decoration: line-through; text-decoration-color: rgba(255, 90, 79, .7); }
.ajudas.esgotadas .ficha:not(.usada) { filter: grayscale(1) brightness(.45); cursor: default; }

/* -------------------------------------------------------------- tacômetro */

.tacometro { position: absolute; left: 1416px; top: 28px; width: 370px; height: 370px; filter: drop-shadow(0 16px 30px rgba(0, 0, 0, .55)); }
.tacometro svg { overflow: visible; }
.taco-zona { fill: none; stroke: #ff2a2a; stroke-width: 7; opacity: .9; }
.taco-risco { stroke: rgba(255, 255, 255, .5); stroke-width: 2; }
.taco-risco.medio { stroke-width: 3; stroke: rgba(255, 255, 255, .8); }
.taco-risco.maior { stroke-width: 4.5; stroke: #fff; }
.taco-risco.quente { stroke: #ff5a4f; }
.taco-num { font: 23px 'pirulen'; fill: #dfe8ff; text-anchor: middle; }
.taco-num.quente { fill: #ff6b61; }
.taco-trilho { fill: none; stroke: rgba(255, 255, 255, .08); stroke-width: 12; stroke-linecap: round; }
.taco-arco { fill: none; stroke-width: 12; stroke-linecap: round; transition: stroke 500ms ease; }
.taco-dig { text-anchor: middle; fill: #fff; }
.taco-dig .i { font: 54px 'pirulen'; }
.taco-dig .d { font: 26px 'pirulen'; fill: #9fb7e8; }
.taco-rot { font: 700 12px 'Open Sans'; letter-spacing: 4px; fill: #7f95c2; text-anchor: middle; }
.tacometro.reta { animation: taco-quente 1s ease-in-out infinite; }
@keyframes taco-quente {
  50% { filter: drop-shadow(0 16px 30px rgba(0, 0, 0, .55)) drop-shadow(0 0 36px rgba(255, 40, 40, .8)); }
}
.tacometro.reta .taco-dig .i, .tacometro.estourou .taco-dig .i { fill: #ff6b61; }
.tacometro.estourou { animation: none; filter: drop-shadow(0 0 44px rgba(255, 40, 40, .95)); }
.tacometro.parado .taco-dig { animation: piscar-dig 260ms steps(2, jump-none) 3; }
@keyframes piscar-dig { 50% { opacity: .15; } }

/* ----------------------------------------- aposta: ERRAR / RECORDE / ACERTAR */

/* A faixa de três caixas do Show do Milhão (ERRAR / PARAR / ACERTAR), com o
   PARAR trocado pelo RECORDE: aqui não se para, e o que está em jogo é a
   posição no ranking — que cai enquanto o relógio anda. */
.aposta { position: absolute; left: 1402px; top: 404px; width: 400px; }
.ap-caixas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.ap-caixa { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.ap-caixa > b {
  display: grid; place-items: center; width: 100%; height: 56px; border-radius: 10px;
  font: 23px/1 'pirulen'; font-weight: normal;
  background: rgba(8, 24, 62, .9); color: #dbe6ff;
  box-shadow: inset 0 0 0 2px rgba(160, 200, 255, .3);
}
.ap-caixa small { font: italic 800 12px/1 'Open Sans'; letter-spacing: 1.5px; color: #cfe0ff; }
.ap-caixa.erro > b { color: #ff9a94; box-shadow: inset 0 0 0 2px rgba(255, 90, 79, .45); }
.ap-caixa.acertar > b {
  background: linear-gradient(180deg, #FFF1B8, #FFC21A 50%, #E88A00); color: #231500;
  box-shadow: 0 0 22px rgba(255, 190, 0, .45);
}
.ap-caixa.acertar small { color: var(--ouro); }
.ap-rolo { display: inline-grid; overflow: hidden; height: 34px; align-items: center; }
.ap-rolo > i { grid-area: 1 / 1; font-style: normal; font-size: 30px; line-height: 34px; }
.ap-barra {
  position: relative; height: 20px; margin: 8px 0 0; border-radius: 10px; overflow: hidden;
  background: rgba(255, 255, 255, .08);
}
.ap-barra i {
  position: absolute; inset: 0; transform-origin: 0 50%;
  background: linear-gradient(90deg, rgba(255, 180, 0, .45), rgba(255, 216, 77, .9));
}
.ap-barra span {
  position: relative; display: block; text-align: center;
  font: 600 13px/20px 'Open Sans'; color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .8);
}
.ap-barra span b { font-weight: 800; }

/* ------------------------------------------------------ pergunta e losangos */

.losango { position: absolute; left: 0; top: 0; overflow: visible; }
.l-base { fill: url(#g-base); }
.l-estado { fill: url(#g-ouro); opacity: 0; transition: opacity 200ms ease; }
/* O verde mora numa camada só dele, por cima da cor de travada: é o que deixa
   a revelação alternar travada ↔ verde, como no programa, sem trocar `fill`
   (que não se anima). */
.l-verde { fill: url(#g-verde); opacity: 0; transition: opacity 200ms ease; }
.l-reflexo { fill: url(#g-reflexo); pointer-events: none; }
.l-borda { fill: none; stroke: #cfd8e6; stroke-width: 3; transition: stroke 220ms ease; }
.l-risco {
  fill: none; stroke: #fff; stroke-width: 5; stroke-linecap: round;
  stroke-dasharray: 8 92; opacity: 0; pointer-events: none;
}

.pergunta { position: absolute; left: 150px; top: 568px; width: 1620px; height: 184px; }
.trilho, .trilho-linha {
  position: absolute; height: 3px;
  box-shadow: 0 0 12px rgba(160, 205, 255, .55);
}
.trilho { top: 91px; width: 150px; }
.trilho.esq { left: -150px; background: linear-gradient(90deg, rgba(207, 216, 230, 0), #cfd8e6); transform-origin: 100% 50%; }
.trilho.dir { left: 1620px; background: linear-gradient(90deg, #cfd8e6, rgba(207, 216, 230, 0)); transform-origin: 0 50%; }
.trilho-linha { background: #cfd8e6; }
.aba {
  position: absolute; left: 64px; top: -30px; height: 34px; padding: 0 30px 0 22px;
  display: flex; align-items: center; gap: 10px;
  font: 16px/1 'pirulen'; letter-spacing: 3px; color: #fff;
  background: linear-gradient(180deg, #ff3b30, #b3140c);
  clip-path: polygon(12px 0, calc(100% - 12px) 0, 100% 100%, 0 100%);
}
.aba span { font: 700 13px/1 'Open Sans'; letter-spacing: 2px; opacity: .85; text-transform: uppercase; }
.aba i { /* triângulo de alerta */
  width: 18px; height: 16px; background: #fff; clip-path: polygon(50% 0, 100% 100%, 0 100%);
  position: relative;
}
.pergunta-texto {
  position: absolute; left: 82px; right: 82px; top: 18px; bottom: 18px;
  display: flex; align-items: center; justify-content: center; text-align: center;
}
.pergunta-texto span { display: block; font: 500 34px/1.26 'Paralucent'; letter-spacing: .4px; color: #fff; text-shadow: 0 2px 10px rgba(0, 0, 0, .5); }

.opcao { position: absolute; width: 795px; height: 110px; cursor: pointer; transition: scale 120ms ease; }
.opcao.apertada { scale: .98; }
@media (hover: hover) { .opcao:hover .l-borda { stroke: #fff; } }
.opcao-conteudo {
  position: absolute; inset: 0 46px; display: flex; align-items: center; gap: 20px;
}
.opcao-num {
  width: 50px; text-align: center; font: 42px/1 'pirulen'; font-weight: normal;
  color: var(--ouro); text-shadow: 0 0 18px rgba(255, 200, 60, .55);
}
.opcao-caixa {
  flex: 1; height: 86px; display: flex; align-items: center;
  padding-left: 20px; border-left: 2px solid rgba(207, 216, 230, .35);
}
.opcao-texto { display: block; font: 500 27px/1.18 'Paralucent'; color: #fff; }

.opcao.travada .l-estado { fill: url(#g-ouro); opacity: 1; }
.opcao.travada .l-borda { stroke: #fff4c2; }
.opcao.travada .opcao-texto, .opcao.travada .opcao-num { color: #231500; text-shadow: none; }
.opcao.travada .opcao-caixa { border-left-color: rgba(35, 21, 0, .35); }
.opcao.travada { animation: travada 900ms ease-in-out infinite alternate; }
@keyframes travada {
  from { filter: drop-shadow(0 0 10px rgba(255, 180, 0, .55)); }
  to { filter: drop-shadow(0 0 32px rgba(255, 190, 0, .95)); }
}
.opcao.fria { filter: brightness(.42) saturate(.35); }
.opcao.meio-fria { filter: brightness(.68) saturate(.7); }
.opcao.certa .l-verde { opacity: 1; }
.opcao.certa .l-borda { stroke: #d6ffe9; }
.opcao.certa .opcao-texto { color: #fff; }
.opcao.certa .opcao-num { color: #fff; text-shadow: 0 0 18px rgba(0, 80, 30, .8); }
.opcao.certa .opcao-caixa { border-left-color: rgba(255, 255, 255, .45); }
.opcao.certa { filter: drop-shadow(0 0 34px rgba(31, 211, 122, .85)); }
.opcao.errada .l-estado { fill: url(#g-vermelho); opacity: 1; }
.opcao.errada .l-borda { stroke: #ffd2cf; }
.opcao.errada .opcao-num { color: #fff; text-shadow: none; }
.opcao.errada { filter: drop-shadow(0 0 30px rgba(255, 59, 48, .8)); }
.opcao.glitch .opcao-conteudo { animation: glitch 80ms steps(2, jump-none) 6; }
@keyframes glitch {
  0% { transform: translateX(-6px); text-shadow: 4px 0 #ff2a6d, -4px 0 #05d9e8; clip-path: inset(0 0 52% 0); }
  100% { transform: translateX(5px); text-shadow: -4px 0 #ff2a6d, 4px 0 #05d9e8; clip-path: inset(40% 0 0 0); }
}

/* ============================================ estilo CLÁSSICO (SBT, 2000)

   O que faz uma tela ser reconhecida como Show do Milhão, e não como o
   Milionário (cujos losangos ligados por uma linha a Globo usa aqui): coluna à
   esquerda com logo, pergunta e as quatro alternativas empilhadas; o número
   num círculo azul de aro branco, que fica VERMELHO quando o jogador escolhe;
   a faixa ERRAR/PARAR/ACERTAR em caixas amarelas com o valor em vermelho; o
   azul royal com raios roxos. Tons amostrados do programa de 30/03/2000. */

.raios-fundo {
  position: absolute; left: 50%; top: 50%; width: 2600px; height: 2600px; margin: -1300px 0 0 -1300px;
  pointer-events: none; opacity: 0; transition: opacity 600ms ease;
  background: repeating-conic-gradient(from 0deg, rgba(115, 110, 216, .34) 0deg 5deg, transparent 5deg 15deg);
  -webkit-mask: radial-gradient(circle, #000 0, #000 20%, transparent 58%);
  mask: radial-gradient(circle, #000 0, #000 20%, transparent 58%);
  animation: girar 90s linear infinite;
}
[data-estilo="classico"] .raios-fundo { opacity: 1; }
[data-estilo="classico"] .fundo {
  background-image: linear-gradient(180deg, rgba(12, 47, 211, .55), rgba(14, 22, 113, .8)), url('../../web/assets/images/BG_Seleo_Equipamento.png');
}
[data-estilo="classico"] .nevoa { background: radial-gradient(ellipse 70% 55% at 72% 45%, rgba(60, 90, 255, .25), transparent 70%); }

[data-estilo="classico"] .pergunta .l-base { fill: url(#g-perg-cl); }
[data-estilo="classico"] .pergunta .l-borda { stroke: #ffd9c7; }
[data-estilo="classico"] .pergunta-texto span { font-style: italic; }
[data-estilo="classico"] .opcao .l-base { fill: url(#g-opcao-cl); }
[data-estilo="classico"] .opcao .l-borda { stroke: #f3c2ae; }
[data-estilo="classico"] .opcao-conteudo { inset: 0 26px 0 16px; gap: 18px; }
[data-estilo="classico"] .opcao-caixa { border-left: 0; padding-left: 0; height: 78px; }
[data-estilo="classico"] .opcao-num {
  width: 64px; height: 64px; flex: none; border-radius: 50%; display: grid; place-items: center;
  font-size: 30px; color: #fff; text-shadow: none;
  background: radial-gradient(circle at 38% 32%, #5b52ff, #372DDB 55%, #1f188f);
  box-shadow: inset 0 0 0 4px #fff, 0 4px 10px rgba(0, 0, 0, .45);
  transition: background 160ms ease;
}
/* A escolha acende o NÚMERO, de azul para vermelho — e a barra esquenta. */
[data-estilo="classico"] .opcao.travada .opcao-num { background: radial-gradient(circle at 38% 32%, #ff7a5c, #e0301e 55%, #8f1206); color: #fff; }
[data-estilo="classico"] .opcao.travada .l-estado { fill: url(#g-trava-cl); }
[data-estilo="classico"] .opcao.travada .opcao-texto { color: #fff; }
[data-estilo="classico"] .opcao.travada .l-borda { stroke: #ffe45c; }
[data-estilo="classico"] .opcao.travada { animation-name: travada-cl; }
@keyframes travada-cl {
  from { filter: drop-shadow(0 0 8px rgba(255, 215, 66, .5)); }
  to { filter: drop-shadow(0 0 26px rgba(255, 215, 66, .95)); }
}
[data-estilo="classico"] .opcao.certa .opcao-num { background: radial-gradient(circle at 38% 32%, #6dffb0, #1FD37A 55%, #007E42); }
[data-estilo="classico"] .opcao.errada .opcao-num { background: #8f1206; }

[data-estilo="classico"] .ap-caixa > b {
  height: 70px; font-size: 30px;
  background: linear-gradient(180deg, #FFF0A0, #FAD742 45%, #E6B800); color: #BA1C01;
  box-shadow: inset 0 0 0 3px #fff6c8, 0 6px 14px rgba(0, 0, 0, .4);
}
[data-estilo="classico"] .ap-caixa small { font-size: 15px; color: #fff; letter-spacing: 3px; }
[data-estilo="classico"] .ap-caixa.acertar > b { box-shadow: inset 0 0 0 3px #fff6c8, 0 0 30px rgba(250, 215, 66, .7); }

/* A posição de cada peça no estilo clássico: a coluna fica com a pergunta, e
   o lado direito vira o "palco" — onde, na TV, aparecia o participante, aqui
   aparece o veículo que chegou para o diagnóstico. */
[data-estilo="classico"] .os { left: 1100px; top: 236px; scale: 1.22; transform-origin: 0 0; }
[data-estilo="classico"] .tacometro { left: 1566px; top: 14px; scale: .8; transform-origin: 0 0; }
[data-estilo="classico"] .ajudas { left: 1112px; top: 860px; }
[data-estilo="classico"] .aposta { left: 60px; top: 894px; width: 960px; }
[data-estilo="classico"] .ap-caixas { gap: 30px; }
[data-estilo="classico"] .ap-barra { margin-top: 10px; }
/* Caixa de cantos redondos, sem pontas: o texto pode ir mais perto da borda. */
[data-estilo="classico"] .pergunta-texto { left: 44px; right: 44px; }
[data-estilo="classico"] .aba { left: 30px; }
/* Os painéis e o cartão da ajuda moram no palco da direita, que é mais estreito. */
[data-estilo="classico"] .painel-titulo { font-size: 42px; }
[data-estilo="classico"] .painel-titulo.menor { font-size: 34px; }
/* A alternativa repetida no painel imita a da coluna: barra de canto redondo,
   número no círculo — vermelho enquanto travada, verde na lição. */
[data-estilo="classico"] .escolhida {
  max-width: 640px; clip-path: inset(0 round 16px); padding: 10px 26px 10px 12px;
  background: linear-gradient(180deg, #ff6a2b, #e03a06 50%, #a51f00); color: #fff;
}
[data-estilo="classico"] .escolhida b {
  flex: none; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-size: 28px;
  background: radial-gradient(circle at 38% 32%, #ff7a5c, #e0301e 55%, #8f1206); box-shadow: inset 0 0 0 4px #fff;
}
[data-estilo="classico"] .escolhida.verde { background: linear-gradient(180deg, #6dffb0, #1FD37A 45%, #007E42); color: #02240f; }
[data-estilo="classico"] .escolhida.verde b { background: radial-gradient(circle at 38% 32%, #6dffb0, #1FD37A 55%, #007E42); color: #fff; }
[data-estilo="classico"] .licao-tv { max-width: 660px; }
[data-estilo="classico"] .licao-tv img { width: 160px; height: 100px; }
[data-estilo="classico"] .cartao { left: 1052px; top: 300px; width: 820px; }
[data-estilo="classico"] .cartao-foto { width: 300px; }

/* ------------------------------------------------------------- o locutor */

.grito {
  position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap;
  font-family: 'pirulen'; line-height: 1.1; letter-spacing: 4px;
  isolation: isolate;
}
/* A faixa escura atrás da frase: por cima do palco cheio (carro, fichas,
   mostrador) o ouro sozinho se perdia. */
.grito::before {
  content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1.3em; z-index: -1;
  transform: translateY(-50%);
  background: linear-gradient(90deg, transparent, rgba(2, 8, 26, .78) 16%, rgba(2, 8, 26, .78) 84%, transparent);
}
.grito span {
  position: relative; display: inline-block; transform: skewX(-7deg);
  background: linear-gradient(180deg, #FFF7CF 0%, #FFD84D 42%, #FF9E00 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 6px 0 #6b3a00) drop-shadow(0 0 28px rgba(255, 190, 60, .6));
}
.grito.vermelho span {
  background-image: linear-gradient(180deg, #FFE0DD 0%, #FF5A4F 45%, #B3140C 100%);
  filter: drop-shadow(0 6px 0 #4a0400) drop-shadow(0 0 28px rgba(255, 60, 40, .65));
}
.grito.branco span {
  background-image: linear-gradient(180deg, #FFFFFF 0%, #CFE0FF 100%);
  filter: drop-shadow(0 5px 0 #0a2a6b) drop-shadow(0 0 24px rgba(120, 180, 255, .65));
}
.grito span::after { /* o brilho que atravessa a palavra */
  content: attr(data-t); position: absolute; inset: 0;
  background: linear-gradient(100deg, transparent 38%, rgba(255, 255, 255, .95) 50%, transparent 62%) no-repeat;
  background-size: 260% 100%; background-position: 200% 0;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: brilho-texto 1s .25s ease-out 1 forwards;
}
@keyframes brilho-texto { to { background-position: -110% 0; } }

.raios {
  position: absolute; left: 960px; top: 300px; width: 1900px; height: 1900px; margin: -950px 0 0 -950px;
  background: repeating-conic-gradient(from 0deg, rgba(255, 216, 77, .30) 0deg 6deg, transparent 6deg 16deg);
  -webkit-mask: radial-gradient(circle, #000 0, #000 16%, transparent 60%);
  mask: radial-gradient(circle, #000 0, #000 16%, transparent 60%);
  mix-blend-mode: screen; animation: girar 16s linear infinite;
}
@keyframes girar { to { rotate: 360deg; } }

.painel {
  position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; filter: drop-shadow(0 24px 40px rgba(0, 0, 0, .65));
}
.painel > .losango .l-base { fill: rgba(4, 16, 46, .975); }
.painel > .losango .l-borda { stroke: #FFD84D; }
.painel > .losango .l-reflexo { opacity: .6; }
.painel-conteudo { position: relative; display: flex; flex-direction: column; align-items: center; }
.painel-titulo { font: 50px/1.05 'pirulen'; letter-spacing: 3px; color: #fff; text-shadow: 0 0 26px rgba(255, 216, 77, .45); }
.painel-titulo.ouro { color: var(--ouro); }
.painel-titulo.menor { font-size: 40px; }
.painel-sub { margin-top: 12px; font: 400 21px/1.4 'Open Sans'; color: #c9d7f5; max-width: 700px; }
.painel-botoes { display: flex; gap: 30px; margin-top: 26px; }
.escolhida {
  margin-top: 18px; max-width: 700px; padding: 12px 34px;
  display: flex; align-items: center; gap: 18px; text-align: left;
  background: linear-gradient(180deg, rgba(255, 216, 77, .95), rgba(255, 160, 0, .95));
  clip-path: polygon(18px 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 18px 100%, 0 50%);
  color: #231500;
}
.escolhida b { font: 38px/1 'pirulen'; font-weight: normal; }
.escolhida span { font: 500 22px/1.25 'Paralucent'; }
.escolhida.verde { background: linear-gradient(180deg, #7CFFB8, #1FD37A 45%, #0B7F45); color: #02240f; }

/* O botão de auditório: losango, ouro, com o brilho passando. O envelope leva
   o brilho de fora (drop-shadow), que o clip-path do botão cortaria. */
.botao-env { display: inline-block; filter: drop-shadow(0 0 16px rgba(255, 190, 0, .5)); }
.botao-env.prata { filter: drop-shadow(0 0 10px rgba(160, 200, 255, .35)); }
.botao-env.pulsa { animation: pulsa 1.15s ease-in-out infinite; }
@keyframes pulsa { 50% { scale: 1.05; filter: drop-shadow(0 0 34px rgba(255, 190, 0, .95)); } }
.botao {
  position: relative; display: grid; place-items: center; overflow: hidden;
  height: 88px; min-width: 300px; padding: 0 58px;
  font: 29px/1 'pirulen'; letter-spacing: 3px; color: #231500; cursor: pointer;
  clip-path: polygon(26px 0, calc(100% - 26px) 0, 100% 50%, calc(100% - 26px) 100%, 26px 100%, 0 50%);
  background: linear-gradient(180deg, #FFF1B8 0%, #FFC21A 50%, #E88A00 100%);
  transition: scale 120ms ease;
}
.botao:active, .botao.apertado { scale: .95; }
.botao.prata { background: linear-gradient(180deg, #F4F7FB 0%, #AEB9CC 55%, #7D889C 100%); color: #0a1a3a; min-width: 220px; }
.botao.menor { height: 72px; font-size: 25px; }
.botao::after {
  content: ''; position: absolute; top: 0; bottom: 0; width: 90px; left: -140px;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .85), transparent);
  animation: botao-brilho 2.6s ease-in-out infinite;
}
@keyframes botao-brilho { 0%, 55% { left: -140px; } 100% { left: calc(100% + 60px); } }

/* O cartão da ajuda: uma conversa, e não um aviso. */
.cartao {
  position: absolute; left: 500px; top: 96px; width: 920px; height: 450px;
  border-radius: 26px; overflow: hidden;
  background: linear-gradient(180deg, rgb(8, 22, 58), rgb(3, 11, 32));
  border: 2px solid rgba(160, 200, 255, .35);
  box-shadow: 0 30px 60px rgba(0, 0, 0, .6);
  display: flex; flex-direction: column;
}
.cartao-topo {
  height: 70px; display: flex; align-items: center; gap: 16px; padding: 0 26px;
  background: var(--cor); color: #fff;
}
.cartao-topo svg { width: 38px; height: 38px; fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.cartao-topo strong { font: 22px/1 'pirulen'; font-weight: normal; letter-spacing: 2px; }
.cartao-topo small { margin-left: auto; font: 700 14px 'Open Sans'; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
.cartao-topo small::before { content: ''; width: 11px; height: 11px; border-radius: 50%; background: #3dff8f; box-shadow: 0 0 10px #3dff8f; }
.cartao-corpo { flex: 1; display: flex; gap: 26px; padding: 24px 28px 0; }
.cartao-foto {
  width: 360px; height: 230px; border-radius: 18px; flex: none;
  background: rgba(255, 255, 255, .92); overflow: hidden; position: relative;
}
.cartao-foto img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.cartao-foto .chamando {
  position: absolute; inset: 0; display: grid; place-items: center;
  background: rgba(3, 11, 32, .72); color: #fff; font: 700 18px 'Open Sans'; letter-spacing: 1px;
}
.cartao-foto .chamando::before {
  content: ''; position: absolute; width: 110px; height: 110px; border-radius: 50%;
  border: 3px solid rgba(255, 255, 255, .8); animation: chamando 1s ease-out infinite;
}
@keyframes chamando { from { transform: scale(.5); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
.cartao-conversa { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
.cartao-quem { font: 700 15px 'Open Sans'; letter-spacing: 1.5px; color: #8fb0ea; text-transform: uppercase; }
.balao {
  position: relative; padding: 18px 22px; border-radius: 4px 20px 20px 20px;
  background: #fff; color: #0a1a3a; font: 500 24px/1.3 'Paralucent'; min-height: 70px;
}
.digitando { display: inline-flex; gap: 7px; padding: 6px 2px; }
.digitando i { width: 11px; height: 11px; border-radius: 50%; background: #7d889c; animation: digitando 900ms ease-in-out infinite; }
.digitando i:nth-child(2) { animation-delay: .15s; }
.digitando i:nth-child(3) { animation-delay: .3s; }
@keyframes digitando { 30% { transform: translateY(-7px); background: #0a1a3a; } 60% { transform: none; } }
.cartao-pe { display: flex; justify-content: flex-end; padding: 0 28px 22px; }
.cartao-pe .botao { height: 70px; font-size: 24px; min-width: 240px; }

/* O resultado: tempo no odômetro e o ranking abrindo espaço para o jogador. */
.resultado { width: 860px; }
.tempo-final { display: flex; align-items: baseline; gap: 20px; }
.tempo-final small { font: 800 16px 'Open Sans'; letter-spacing: 3px; color: #9fb7e8; }
.tempo-final b { font: 56px/1 'pirulen'; font-weight: normal; color: var(--ouro); text-shadow: 0 0 24px rgba(255, 216, 77, .5); }
.lista { position: relative; width: 640px; height: 200px; margin-top: 12px; }
.linha {
  position: absolute; left: 0; right: 0; height: 36px; display: flex; align-items: center; gap: 18px; padding: 0 26px;
  font: 20px/1 'pirulen'; color: #fff; background: rgba(12, 34, 88, .8);
  clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 14px 100%, 0 50%);
}
.linha .p { width: 48px; color: #9fb7e8; }
.linha .n { flex: 1; text-align: left; }
.linha .t { color: #cfe0ff; }
.linha.eu { background: linear-gradient(180deg, #FFF1B8, #FFC21A 50%, #E88A00); color: #231500; }
.linha.eu .p, .linha.eu .t { color: #231500; }
.licao-tv { display: flex; align-items: center; gap: 22px; margin-top: 18px; max-width: 760px; text-align: left; }
.licao-tv img { width: 190px; height: 118px; object-fit: contain; object-view-box: inset(18.9% 5.3% 10.5% 6.7%); flex: none; background: rgba(255, 255, 255, .92); border-radius: 12px; padding: 8px; }
.licao-tv small { display: block; font: 800 14px 'Open Sans'; letter-spacing: 2.5px; color: #ff8a80; margin-bottom: 6px; }
.licao-tv p { margin: 0; font: 500 22px/1.3 'Paralucent'; color: #fff; }

/* ------------------------------------------------------ abertura e lâmina */

.abertura {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at 50% 42%, #0b2c78 0%, #031033 45%, #000611 80%);
}
.abertura .selo { position: relative; }
.abertura h1 { margin: 6px 0 0; font: 30px/1.2 'pirulen'; font-weight: normal; letter-spacing: 6px; color: #fff; }
.abertura p { margin: 14px 0 30px; max-width: 900px; text-align: center; font: 400 21px/1.5 'Open Sans'; color: #b8c9ea; }
.abertura kbd {
  display: inline-block; min-width: 26px; padding: 1px 7px; border-radius: 6px; margin: 0 2px;
  border: 1px solid rgba(255, 255, 255, .35); font: 700 15px 'Open Sans'; color: #fff; background: rgba(255, 255, 255, .08);
}
.abertura .atalhos { margin-top: 30px; font: 400 17px/1.8 'Open Sans'; color: #8ea3c9; text-align: center; }
.lamina {
  position: absolute; left: -200px; top: -200px; width: 2320px; height: 1480px; pointer-events: none; opacity: 0;
  background: linear-gradient(100deg, transparent 43%, rgba(90, 170, 255, .0) 45%, rgba(150, 210, 255, .8) 49%, #fff 50%, rgba(150, 210, 255, .8) 51%, rgba(90, 170, 255, 0) 55%, transparent 57%);
}

/* ------------------------------------------------------ menos movimento */

.menos .lampada, .menos .ficha-face::after, .menos .botao::after, .menos .raios,
.menos .botao-env.pulsa, .menos .opcao.travada, .menos .tacometro.reta, .menos .cartao-foto .chamando::before,
.menos .digitando i, .menos .opcao.glitch .opcao-conteudo { animation: none !important; }
.menos .opcao.travada { filter: drop-shadow(0 0 24px rgba(255, 190, 0, .9)); }

/* --------------------------------------- barra do protótipo (fora do palco) */

.demo {
  position: fixed; left: 12px; top: 12px; z-index: 10; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 6px 8px; border-radius: 12px; max-width: calc(100vw - 24px);
  background: rgba(3, 10, 28, .82); border: 1px solid rgba(160, 200, 255, .25);
  font: 12px/1.2 system-ui, sans-serif; color: #cfe0ff;
  transition: opacity 400ms ease;
}
.demo.sumida { opacity: 0; pointer-events: none; }
.demo b { color: #ffd84d; padding: 0 6px; letter-spacing: 1px; }
.demo button {

  border: 1px solid rgba(255, 255, 255, .18); border-radius: 8px; padding: 5px 9px;
}

.demo button[aria-pressed="true"] { background: rgba(255, 216, 77, .25); border-color: rgba(255, 216, 77, .6); }
.demo kbd { opacity: .6; margin-left: 4px; font: inherit; }
.demo .gab { padding: 0 6px; opacity: .8; }

    { chave: 'apoio', nome: 'APOIO TÉCNICO', rotulo: 'APOIO\nTÉCNICO', icone: ICONE.fone, cor: '#0B5BD3', foto: 'Apoio_(1).png', recorte: 'inset(20.5% 4.6% 25% 4.8%)', verbo: 'Chamando o Apoio Técnico…', quem: 'Apoio Técnico Tecnomotor' },
